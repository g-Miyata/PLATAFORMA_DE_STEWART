name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: interface/backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  web:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: interface/web/dist

  e2e:
    name: Ponta a ponta + acessibilidade (simulador)
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: interface/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/web/package-lock.json
      - run: pip install -r interface/backend/requirements.txt
      - working-directory: interface/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - working-directory: interface/web
        env:
          PW_CHANNEL: chromium
          PYTHON: python
        run: npx playwright test

  release:
    name: Anexa o build à release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - run: cd dist && zip -r ../stewart-web-dist.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: stewart-web-dist.zip
