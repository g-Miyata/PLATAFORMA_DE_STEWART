<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interface de controle da Plataforma de Stewart do IFSP - Campus São José dos Campos" />
    <link rel="icon" type="image/svg+xml" href="/brand/ifsp-simbolo.svg" />
    <title>Plataforma de Stewart · IFSP</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura (evita piscar claro/escuro)
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('stewart-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
